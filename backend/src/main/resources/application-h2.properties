# Perfil h2 legado — preferir la BD por defecto en application.properties
# que ya apunta a ../db/productos_limpieza (exclusiva del proyecto).
spring.config.activate.on-profile=h2

spring.datasource.url=jdbc:h2:file:../db/productos_limpieza;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;DATABASE_TO_UPPER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=plimpieza
spring.datasource.password=plimpieza_local

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-plimpieza

app.import-on-startup=false
app.force-import=false
app.seed-path=../data
