spring.application.name=productos-limpieza
server.port=8083

# Base de datos PROPIA de este proyecto (archivo local, no comparte nada con otros sistemas)
# Ubicación: A:\Negocios\productos-limpieza\db\productos_limpieza.*
spring.datasource.url=jdbc:h2:file:../db/productos_limpieza;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;DATABASE_TO_UPPER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=plimpieza
spring.datasource.password=plimpieza_local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-plimpieza

# Importa el Excel solo si la BD está vacía
app.import-on-startup=true
app.force-import=false
app.seed-path=../data

spring.jackson.serialization.write-dates-as-timestamps=false
