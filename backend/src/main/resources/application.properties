spring.application.name=productos-limpieza
server.port=8083

# Oracle XE propio (Docker: oracle-productos-limpieza)
# Puerto host 1551 para no chocar con 1521/1522 de otros proyectos
spring.datasource.url=jdbc:oracle:thin:@localhost:1551/XEPDB1
spring.datasource.username=productos_limpieza
spring.datasource.password=ProductosLimpieza2026
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.show-sql=false

# La fuente de verdad es Oracle. No reimportar en cada arranque.
# Solo activar APP_IMPORT_ON_STARTUP=true si la BD está vacía y hay que sembrar una vez.
app.import-on-startup=false
app.force-import=false
app.seed-path=../data

spring.jackson.serialization.write-dates-as-timestamps=false
