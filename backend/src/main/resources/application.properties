spring.application.name=productos-limpieza
# Fijo — no cambiar ni dejar que Angular/Spring abran otro puerto.
# Productos limpieza: front 4202 / API 8083 / Oracle 1551
server.port=8083

# Oracle XE (Docker: oracle-productos-limpieza, puerto host 1551)
spring.datasource.url=jdbc:oracle:thin:@localhost:1551/XEPDB1
spring.datasource.username=productos_limpieza
spring.datasource.password=ProductosLimpieza2026
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.show-sql=false

# Fuente de verdad: Oracle. Semilla JSON solo si la BD está vacía.
app.import-on-startup=false

spring.jackson.serialization.write-dates-as-timestamps=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:4202,http://localhost:4202,http://127.0.0.1:8083,http://localhost:8083}
