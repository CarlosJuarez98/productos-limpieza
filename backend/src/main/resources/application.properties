spring.application.name=productos-limpieza
# Fijo — no cambiar ni dejar que Angular/Spring abran otro puerto.
# Productos limpieza: front 4202 / API 8083 / Oracle 1551
server.port=8083

# Oracle XE (Docker: oracle-productos-limpieza, puerto host 1551)
spring.datasource.url=jdbc:oracle:thin:@localhost:1551/XEPDB1
spring.datasource.username=productos_limpieza
spring.datasource.password=ProductosLimpieza2026
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false

# Fuente de verdad: Oracle. Semilla JSON solo si la BD está vacía.
app.import-on-startup=false
# Carga local única desde Excel Mama (data-mama/). Dejar false tras un boot exitoso.
app.import-mama-replace=false
# Semilla única tenant admin desde _migrate/cloud_dump.json. Dejar false tras un boot exitoso.
app.import-admin-cloud=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Login (2 usuarios, mismas pantallas)
app.auth.admin.username=${APP_AUTH_ADMIN_USER:admin}
app.auth.admin.password=${APP_AUTH_ADMIN_PASSWORD:1Amorcas23}
app.auth.mama.username=${APP_AUTH_MAMA_USER:mama}
app.auth.mama.password=${APP_AUTH_MAMA_PASSWORD:1Mama23}

# Sesión HTTP: máximo 20 minutos (idle = absoluto vía filtro)
server.servlet.session.timeout=20m
server.servlet.session.cookie.name=PLSESSID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
# En HTTPS (Caddy) poner SERVER_SERVLET_SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=framework

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:4202,http://localhost:4202,http://127.0.0.1:8083,http://localhost:8083}
