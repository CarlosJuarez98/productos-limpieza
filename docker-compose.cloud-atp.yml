# Despliegue en Oracle Cloud (Ampere/ARM) + Autonomous DB (ATP).
# Uso: docker compose -f docker-compose.cloud-atp.yml --env-file .env.cloud up -d --build
#
# HTTPS: Caddy en :80/:443 con Let's Encrypt (renueva solo).
# URL: https://productos.163.192.146.143.sslip.io/
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: productos-limpieza-api
    ports:
      # Solo localhost en la VM (salud/debug). Público: HTTPS vía Caddy.
      - "127.0.0.1:8083:8083"
    env_file:
      - .env.cloud
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: oracle.jdbc.OracleDriver
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:-false}
      APP_IMPORT_ON_STARTUP: "false"
      APP_ARCHIVO_ANUAL_ENABLED: "true"
      APP_ARCHIVO_ANUAL_PATH: /app/archivo-anual
      APP_PUBLICIDAD_GALERIA_PATH: /app/uploads/publicidad-galeria
      APP_AUTH_OVERRIDES_FILE: /app/data/auth-overrides.properties
      SERVER_PORT: "8083"
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Doracle.net.tns_admin=/wallet"
      LOGGING_LEVEL_COM_PRODUCTOSLIMPIEZA: INFO
    volumes:
      - ./wallet:/wallet:ro
      - archivo-anual-data:/app/archivo-anual
      - ./uploads/publicidad-galeria:/app/uploads/publicidad-galeria
      - auth-data:/app/data
    mem_limit: 768m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: productos-limpieza-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - default
      # Acceso persistente a APIs hermanas (mismo Caddy)
      - control_gastos
      - mesa_lista
      - taximetro
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  auth-data:
    name: productos-limpieza-auth-data
  archivo-anual-data:
    name: productos-limpieza-archivo-anual

networks:
  control_gastos:
    external: true
    name: control-gastos_default
  mesa_lista:
    external: true
    name: mesa-lista_default
  taximetro:
    external: true
    name: taximetro_default

