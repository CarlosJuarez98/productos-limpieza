<h2 class="page-title">{{ marca }}</h2>
<p class="muted lista-subtitulo">Lista de precios · {{ fechaLista }}</p>

<section class="panel">
  <div class="toolbar">
    <label>
      Buscar
      <input class="search" [(ngModel)]="filtro" name="filtro" placeholder="Producto..." />
    </label>
    <fieldset class="export-cols">
      <legend>Exportar (menudeo siempre)</legend>
      <label class="chk">
        <input type="checkbox" [(ngModel)]="cols.mayoreo5" name="colMay5" />
        Mayoreo ≥ 5
      </label>
      <label class="chk">
        <input type="checkbox" [(ngModel)]="cols.mayoreo10" name="colMay10" />
        Mayoreo ≥ 10
      </label>
    </fieldset>
    <button type="button" class="secondary" (click)="exportarLista()" [disabled]="exportando">
      {{ exportando ? 'Exportando…' : 'Exportar lista (.xlsx)' }}
    </button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Menudeo</th>
          <th>≥ 5 L</th>
          <th>≥ 10 L</th>
        </tr>
      </thead>
      <tbody>
        @for (i of filtrados; track i.id) {
          <tr>
            <td>{{ i.nombre }}</td>
            <td class="money">${{ i.precioVentaHoy | number: '1.2-2' }}</td>
            <td class="money">${{ i.precioMayoreo5 | number: '1.2-2' }}</td>
            <td class="money">${{ i.precioMayoreo10 | number: '1.2-2' }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
