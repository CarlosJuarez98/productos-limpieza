<div class="login-page">
  <form class="login-card ui-card panel-anim" (ngSubmit)="enviar()" autocomplete="on">
    <img class="logo" src="amorcas-logo.png" alt="AMORCAS" width="80" height="80" />
    <h1>Amorcas</h1>
    <p class="login-sub">La química perfecta para tu hogar</p>
    @if (sesionActual) {
      <p class="sesion-aviso">Ya hay sesión de <strong>{{ sesionActual }}</strong>. Entra de nuevo para cambiar de usuario.</p>
    }

    <label>
      Usuario
      <input
        type="text"
        name="username"
        appClearable
        [(ngModel)]="username"
        autocomplete="username"
        required
        autofocus
      />
    </label>
    <label>
      Contraseña
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
      />
    </label>

    <label class="recordar-row">
      <input type="checkbox" name="recordar" [(ngModel)]="recordar" />
      Recordarme 7 días
    </label>
<app-page-alerts [(error)]="error" />

    <button type="submit" [disabled]="cargando">
      {{ cargando ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</div>
