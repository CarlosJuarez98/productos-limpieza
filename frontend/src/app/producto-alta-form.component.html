<form class="form-grid form-alta" (ngSubmit)="guardar()">
  <label>
    Nombre del producto
    <input
      appClearable
      [(ngModel)]="form.nombre"
      [name]="namePrefix + 'Nombre'"
      required
    />
  </label>
  <label>
    Departamento
    <select [(ngModel)]="form.departamento" [name]="namePrefix + 'Departamento'">
      <option value="LIMPIEZA">Limpieza</option>
      <option value="JARCERIA">Jarcería</option>
    </select>
  </label>
  <label>
    Se vende por
    <select [(ngModel)]="form.vendePor" [name]="namePrefix + 'VendePor'">
      <option value="LITROS">Litros</option>
      <option value="PIEZA">Pieza</option>
    </select>
  </label>
  <label>
    Cantidad comprada
    <input
      type="text"
      inputmode="decimal"
      appClearable
      [ngModel]="form.cantidadInicial"
      (ngModelChange)="onCantidadChange($event)"
      [name]="namePrefix + 'Cantidad'"
      placeholder="Vacío = 1"
    />
  </label>
  <label>
    Total pagado
    <div class="precio-input">
      <span class="peso">$</span>
      <input
        type="text"
        inputmode="decimal"
        appClearable
        [ngModel]="form.totalPagado"
        (ngModelChange)="onTotalChange($event)"
        [name]="namePrefix + 'Total'"
        placeholder="Ej. 25"
      />
    </div>
  </label>
  <div class="campo-baston-alta">
    <span class="campo-label">Bastón</span>
    <div class="baston-opts" role="group" aria-label="¿Usa bastón?">
      <button
        type="button"
        class="btn-baston na"
        [class.activo]="tipoBaston === 'NA'"
        [attr.aria-pressed]="tipoBaston === 'NA'"
        title="No usa bastón"
        (click)="setTipoBaston('NA')"
      >
        NA
      </button>
      <button
        type="button"
        class="btn-baston falta"
        [class.activo]="tipoBaston === 'FALTA'"
        [attr.aria-pressed]="tipoBaston === 'FALTA'"
        title="Falta armar"
        (click)="setTipoBaston('FALTA')"
      >
        Falta
      </button>
      <button
        type="button"
        class="btn-baston trae"
        [class.activo]="tipoBaston === 'TRAE'"
        [attr.aria-pressed]="tipoBaston === 'TRAE'"
        title="Trae bastón"
        (click)="setTipoBaston('TRAE')"
      >
        Trae
      </button>
    </div>
  </div>
  <label class="campo-unitario-alta">
    {{ etiquetaPrecio }}
    <div class="precio-input">
      <span class="peso">$</span>
      <input
        type="text"
        inputmode="decimal"
        appClearable
        [ngModel]="form.precioCompra"
        (ngModelChange)="onUnitarioChange($event)"
        [name]="namePrefix + 'Unitario'"
        placeholder="Ej. 25"
      />
    </div>
    @if (tipoBaston === 'FALTA' && compraCatalogo != null && costoBaston > 0) {
      <span class="hint-unitario muted"
        >Compra final ${{ compraCatalogo | number: '1.2-2' }} (incluye bastón)</span
      >
    }
  </label>
  <label>
    Precio menudeo
    <div class="precio-input">
      <span class="peso">$</span>
      <input
        type="text"
        inputmode="decimal"
        appClearable
        [(ngModel)]="form.precioVenta"
        [name]="namePrefix + 'Menudeo'"
        required
        (ngModelChange)="onMenudeoChange()"
        [placeholder]="menudeoPlaceholder"
      />
    </div>
  </label>
  <div class="alta-pie">
    <div class="edicion-actions">
      <button type="submit" [disabled]="!completa || guardando">
        {{ guardando ? '…' : submitLabel }}
      </button>
      <button type="button" class="secondary" (click)="cancelado.emit()">Cancelar</button>
    </div>
  </div>
</form>
<app-page-alerts [(error)]="error" />
