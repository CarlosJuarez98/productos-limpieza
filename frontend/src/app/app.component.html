<header class="top">
  <div class="brand">
    <img class="mark" src="amorcas-logo.png" alt="AMORCAS" width="52" height="52" />
    <div>
      <h1>Productos de limpieza Amorcas</h1>
    </div>
  </div>
  <nav>
    @for (link of links; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
    }
  </nav>
</header>
<main>
  <router-outlet />
</main>
<app-confirm-dialog />
